name: Telegraph dependency updates

on:
  push:
    branches:
      - main
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/requirements*.txt'
      - 'requirements/**'
  workflow_dispatch:

concurrency:
  group: telegraph-dependency-updates-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-dependencies:
    if: github.ref_type == 'branch' && github.event.deleted != true && !startsWith(github.ref_name, 'fix/telegraph-dependency-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      status: ${{ steps.update.outputs.status }}
      has-findings: ${{ steps.update.outputs.has-findings }}
      pull-requests: ${{ steps.update.outputs.pull-requests }}
      message: ${{ steps.update.outputs.message }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Setup Node.js for npm lockfile generation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Assess dependencies and open update PRs
        id: update
        uses: ./bot/actions
        env:
          TELEGRAPH_EVM_PRIVATE_KEY: ${{ secrets.TELEGRAPH_EVM_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Assumptions for setup only; miner 0 cannot initiate a paid purchase.
          MODEL_CUTOFF: ${{ vars.MODEL_CUTOFF || '2025-01-01' }}
          PREFERRED_MINER_ID: ${{ vars.PREFERRED_MINER_ID || '7314' }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'assumed-provider' }}
          MODEL_ID: ${{ vars.MODEL_ID || 'assumed-model' }}
          MODEL_CUTOFF_SOURCE_URL: ${{ vars.MODEL_CUTOFF_SOURCE_URL || 'https://github.com/borodedamie/telegraph-pr-agent/blob/main/docs/SPEC.md' }}
          MODEL_CUTOFF_STATUS: ${{ vars.MODEL_CUTOFF_STATUS || 'team-assumed' }}
          MODEL_CONFIGURED_AT: ${{ vars.MODEL_CONFIGURED_AT }}
