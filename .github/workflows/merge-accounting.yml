name: Record merged dependency PR costs

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Merged dependency PR number to recover accounting"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegraph-merge-accounting-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

jobs:
  record-merge:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'fix/telegraph-dependency-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ./bot/actions
        with:
          merge-pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
