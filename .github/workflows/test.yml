
name: Test GitHub Bot

on:
  push:
    branches:
      - feat/cli

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/actions/package-lock.json

      - name: Install dependencies
        working-directory: ./bot/actions
        run: npm ci

      - name: Build TypeScript Action
        working-directory: ./bot/actions
        run: npm run build

      - name: Execute Local GitHub Action
        id: bot
        uses: ./bot/actions
        with:
          name: "My Test Application"
          environment: "development"

      - name: Display Bot Result
        env:
          BOT_MESSAGE: ${{ steps.bot.outputs.message }}
        run: |
          echo "Bot Response: $BOT_MESSAGE"
