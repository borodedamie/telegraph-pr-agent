name: Find installs of the Action

# Hourly until 1 Dec 2026: find repositories that use the Action (PR search for the bot's branches,
# code search, the dependents page) and publish the list as installs.json on this repository's
# ledger branch. The dashboard reads that file, so a new installation, team or outside, appears
# with its purchases and merges without a code change. A new repository is also reported on the
# issue "Installs of the Action". No wallet key, no purchase.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: find-installs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Stop after the event window
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261201 ]; then
            echo "Past 1 Dec 2026: nothing to do. Remove this workflow."
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        if: steps.window.outputs.open == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.window.outputs.open == 'true'
        with:
          node-version: 24
      - name: Find installs
        if: steps.window.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ledger/installs.json" -o previous.json || echo '{"installs":[]}' > previous.json
          node scripts/find-installs.mjs --previous previous.json --out installs.json > report.md
          cat report.md
      - name: Publish installs.json to the ledger branch
        if: steps.window.outputs.open == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if cmp -s previous.json installs.json; then
            echo "List unchanged; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git init -q publish && cd publish
          git config user.name "Telegraph dependency agent"
          git config user.email "telegraph-agent@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git fetch -q --depth 1 origin ledger
            git checkout -q -B ledger FETCH_HEAD
            cp ../installs.json installs.json
            git add installs.json
            git diff --cached --quiet && { echo "Already published."; break; }
            git commit -qm "ledger: installs list"
            git push -q origin ledger && break
            echo "Push rejected (another writer); retrying ($attempt)."
            [ "$attempt" = 3 ] && { echo "::error::Could not publish installs.json after 3 attempts"; exit 1; }
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Report new repositories on the tracking issue
        if: steps.window.outputs.open == 'true' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Installs of the Action"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body-file report.md
          else
            gh issue comment "$number" --body-file report.md
          fi
