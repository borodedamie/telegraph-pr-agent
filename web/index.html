<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegraph PR Agent — Spend Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --desk: #14262b;     /* telegraph-office felt */
        --desk-2: #192e34;   /* raised panel */
        --desk-line: #24414a;
        --form: #e9e4d4;     /* telegram blank */
        --tape: #f1d86a;     /* pasted ticker strip */
        --ink: #1a1712;
        --brass: #c9a55f;
        --muted: #8fa7a8;
        --stamp-ok: #2f5fa8;
        --stamp-bad: #c42b55;
        --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
        --body: "IBM Plex Sans Condensed", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
        --serif: "Newsreader", Georgia, serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 3rem 1.25rem 4rem;
        background: var(--desk);
        color: var(--form);
        font: 400 1rem/1.5 var(--body);
      }
      #app { max-width: 1020px; margin: 0 auto; }
      a { color: inherit; }
      :focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

      /* ── masthead ─────────────────────────────── */
      .masthead {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid var(--desk-line);
        padding-bottom: 1.1rem;
      }
      h1 {
        font: 800 clamp(3.25rem, 11vw, 6.5rem)/0.85 var(--display);
        text-transform: uppercase;
        letter-spacing: 0.02em;
        margin: 0;
        color: var(--tape);
      }
      .sub { margin: 0.55rem 0 0; color: var(--muted); font-size: 0.95rem; }
      .sub code { font: 500 0.85em var(--mono); color: var(--brass); }
      .spend-total { text-align: right; }
      .spend-total .label {
        display: block;
        font: 500 0.72rem var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .spend-total .figure {
        font: 500 clamp(1.6rem, 4.5vw, 2.3rem)/1.1 var(--mono);
        color: var(--form);
      }
      .spend-total .figure small { font-size: 0.55em; color: var(--brass); }

      /* ── boundary note (compliance line) ──────── */
      .boundary {
        margin: 1.4rem 0;
        padding: 0.75rem 1rem;
        border: 1px dashed var(--brass);
        color: var(--muted);
        font-size: 0.9rem;
      }
      .boundary strong { color: var(--brass); font-style: italic; font-weight: 600; }

      /* ── tally strip ──────────────────────────── */
      .tally {
        font: 500 0.78rem var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--brass);
        margin: 1.8rem 0 0.9rem;
      }
      .tally .dot { color: var(--desk-line); padding: 0 0.35rem; }

      /* ── the ledger table ─────────────────────── */
      .ledger-wrap { overflow-x: auto; }
      table.ledger {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }
      table.ledger th {
        font: 500 0.72rem var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.13em;
        color: var(--muted);
        text-align: left;
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--desk-line);
        white-space: nowrap;
      }
      table.ledger th.num, table.ledger td.num { text-align: right; }
      table.ledger td {
        padding: 0.85rem 0.9rem;
        border-bottom: 1px solid var(--desk-line);
        vertical-align: middle;
      }
      table.ledger tbody tr { transition: background 0.15s ease; }
      table.ledger tbody tr:hover { background: var(--desk-2); }
      td .time { font: 400 0.85rem var(--mono); color: var(--muted); white-space: nowrap; }
      td .pr { font: 500 0.95rem var(--mono); color: var(--tape); }
      td .intent { font: 600 0.8rem var(--body); text-transform: uppercase; letter-spacing: 0.08em; }
      td .miner { max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      td .amount { font: 500 0.95rem var(--mono); white-space: nowrap; }
      td .amount small { color: var(--brass); font-size: 0.8em; margin-left: 0.3em; }

      .status { font: 600 0.72rem var(--body); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
      .status::before { content: "● "; }
      .status.settled { color: var(--stamp-ok); }
      .status.failed { color: var(--stamp-bad); }

      .view-btn {
        appearance: none;
        background: none;
        border: 1px solid var(--desk-line);
        color: var(--form);
        font: 500 0.78rem var(--body);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.42rem 0.85rem;
        cursor: pointer;
        white-space: nowrap;
        transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      }
      .view-btn:hover { border-color: var(--brass); color: var(--tape); background: #1d353c; }

      /* ── empty / error state ──────────────────── */
      .empty {
        margin-top: 2rem;
        padding: 2.5rem 1.25rem;
        border: 1px solid var(--desk-line);
        text-align: center;
      }
      .empty p:first-child {
        font: 800 2.1rem/1 var(--display);
        text-transform: uppercase;
        color: var(--tape);
        margin: 0;
      }
      .empty .detail { color: var(--muted); font-size: 0.9rem; margin: 0.75rem 0 0; }

      /* ── detail drawer (the telegram blank) ───── */
      .backdrop {
        position: fixed;
        inset: 0;
        background: #0b1619cc;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 40;
      }
      .backdrop.open { opacity: 1; pointer-events: auto; }

      aside.drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100dvh;
        width: min(560px, 94vw);
        background: var(--form);
        color: var(--ink);
        z-index: 50;
        transform: translateX(102%);
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        overflow-y: auto;
        box-shadow: -30px 0 60px -30px #000a;
      }
      aside.drawer.open { transform: translateX(0); }

      .drawer-inner { padding: 1.8rem 2rem 2.2rem; }
      .drawer-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        border-bottom: 1px solid #d3ccb8;
        padding-bottom: 0.9rem;
      }
      .drawer-head h2 {
        margin: 0;
        font: 800 1.9rem/1 var(--display);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .drawer-head .status.settled { color: var(--stamp-ok); }
      .drawer-head .status.failed { color: var(--stamp-bad); }
      .close-btn {
        appearance: none;
        background: none;
        border: 1px solid #c9c1a9;
        color: var(--ink);
        font: 500 0.85rem var(--mono);
        padding: 0.35rem 0.7rem;
        cursor: pointer;
      }
      .close-btn:hover { border-color: var(--ink); }

      .drawer .line {
        margin: 1.3rem 0 0;
        font: 400 1.35rem/1.42 var(--serif);
        text-wrap: pretty;
      }
      .drawer .line strong { font-weight: 600; }
      .drawer .answer {
        margin: 1rem 0 0;
        padding-left: 0.95rem;
        border-left: 2px solid var(--brass);
        font: italic 400 1.05rem/1.55 var(--serif);
        color: #4d4839;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .drawer .answer::before { content: "\201C"; }
      .drawer .answer::after { content: "\201D"; }

      dl.fields {
        margin: 1.6rem 0 0;
        border-top: 1px solid #d3ccb8;
      }
      dl.fields > div {
        display: grid;
        grid-template-columns: 11ch 1fr;
        gap: 1rem;
        padding: 0.65rem 0;
        border-bottom: 1px solid #d3ccb8;
      }
      dl.fields dt {
        font: 500 0.72rem var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.11em;
        color: #6b6553;
        padding-top: 0.15rem;
      }
      dl.fields dd {
        margin: 0;
        font: 400 0.92rem var(--mono);
        overflow-wrap: anywhere;
      }
      dl.fields dd a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }

      .drawer-foot {
        margin-top: 1.6rem;
        font: 400 0.82rem var(--body);
        color: #6b6553;
      }
      .drawer-foot code { font: 400 0.9em var(--mono); }

      @keyframes arrive { from { opacity: 0; transform: translateY(8px); } }
      .row-anim { animation: arrive 0.4s ease-out both; animation-delay: calc(var(--i) * 55ms); }

      @media (prefers-reduced-motion: reduce) {
        .row-anim { animation: none; }
        aside.drawer, .backdrop { transition: none; }
      }
      @media (max-width: 640px) {
        body { padding: 2rem 0.9rem 3rem; }
        .spend-total { text-align: left; }
        .drawer-inner { padding: 1.4rem 1.25rem 2rem; }
        dl.fields > div { grid-template-columns: 1fr; gap: 0.15rem; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="backdrop" id="backdrop" hidden></div>
    <aside
      class="drawer"
      id="drawer"
      role="dialog"
      aria-modal="true"
      aria-label="Receipt details"
      hidden
    ></aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
